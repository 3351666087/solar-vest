# Placement-gate PREVIEW rows (lead ruling P-6, LEAD_NOTES §2o, 2026-11-16). Read by tools/cplgate.py.
# A part becomes PREVIEW (not RED / UNKNOWN) only when (a) every other machine check passes and (b) each of its remaining red reasons
# matches an `allow` pattern of an entry naming this exact ref AND C-number. A changed C-number, a new reason or any YELLOW keeps it
# RED / UNKNOWN / YELLOW. A polarised part whose pin map is reviewed by `independent-agent` (P-6) is also PREVIEW, never GREEN: the human
# check is its preview row. Each PREVIEW row carries `look` (what to see in the JLC preview) and its electrical test (placement_proof.json).
# This file is the lead's ruling written down; it is not a waiver (waivers.yaml stays empty). Changing it needs a lead ruling.
ruling: P-6 (LEAD_NOTES §2o, 2026-11-16)
rows:
  - refs: [D3, D4]
    lcsc: C5603826
    why: "bottom-side part (skin side); the CPL bottom convention D_b is self-consistent in G7 but unverified at JLC (no bottom canary)"
    allow: ['^R3:']
    look: 'BOTTOM preview (JLC mirrors it): the large lead on the large land; pad 1 (small land, anode, net VLED) at the place shown as the black dot in review/placement_bottom.png; if JLC shows the part turned or mirrored: STOP'
  - refs: [PD1]
    lcsc: C511402
    why: "bottom-side part; D_b unverified at JLC"
    allow: ['^R3:']
    look: 'BOTTOM preview (mirrored): the VEMD8080 pin-1 dot on board pad 1 (PD1_IN corner); pad 5 (anode, PD_GND) at the diagonal corner; the window (optical centre) toward the skin'
  - refs: [J11, J15, J18, J19]
    lcsc: C2826535
    why: "single-pad spring finger; 0 and 180 deg fit the same land and differ mechanically (contact tip 0.6-0.8 mm off the pad centre)"
    allow: ['^UNKNOWN: 1 shared pad number']
    look: 'spring arm direction as the CPL rotation (EasyEDA +X arrow in review/placement_top.png); the tip must stay over the mating tab / rim-pin face / frame (covers both turns by design, placement_proof)'
  - refs: [J40]
    lcsc: C2826518
    why: "single-pad spring finger at 340 deg (ruling L-1 / J-1); 0 and 180 deg fit the same land; R7 non-orthogonal angle placed by JLC as given"
    allow: ['^UNKNOWN: 1 shared pad number', '^R7: rotation 340\.0 deg']
    look: 'rotation 340 deg accepted as typed (no rounding to 0/90), arm toward +X, finger body inside the copper-free pocket; contact point on the lid strip pad at both turns'
  - refs: [D12]
    lcsc: C549313
    why: "no EasyEDA record for C549313 (404 on 2026-11-13 and 2026-11-16): the CPL uses the labelled proxy land of C549275; JLC's own 0 deg is unknown (no second mark source)"
    allow: ['^PROXY:']
    look: 'the large lead (common cathode, pin 3) on board pad 3 (EN_HOLD) and the two small leads on pads 1 (VB_DET) and 2 (BTN); if JLC turns the part to its own library 0 deg, re-check that the large lead still sits on pad 3'
  - refs: [SW1]
    lcsc: C221907
    why: "mechanically polar (class M); 4-pad copper is 2-fold symmetric; actuator side settled by the EasyEDA silk and the maker drawing (pin 5 opposite the actuator), still only visible in the preview"
    allow: []
    look: 'actuator toward the hand-end board edge (wall), i.e. on the side of pads 1/2 (BTN_SUP) = EasyEDA -X; 3D view: the stem points out of the board edge'
# look items for polarised parts that are PREVIEW only because of the P-6 pin-map review (G3); keyed by ref
g3_look:
  D9: 'SOD523 cathode band on pad 1 (EN_HOLD)'
  D11: 'SOD523 cathode band on pad 1 (CYC_A)'
  D10: 'cathode (terminal 1) on pad 1 (ALERT_K) and the lens facing the board edge'
  D14: 'CFP3 marking bar (cathode) on pad 1 (VBUS)'
  D16: 'X2DFN2 pin-1 indicator (cathode) on pad 1 (VBUS); the EasyEDA silk dot sits at pad 1; ignore the "-RD" in the package name'
  D3: 'see the bottom row'
  D4: 'see the bottom row'
  PD1: 'see the bottom row'
