  '8':
    name: 'VRDIV'
    type: output
    function: Bias output for the high side of all dividers
  '9':
    name: 'NC'
    type: passive
    function: Connect to ground using the PowerPAD
  '10':
    name: 'OK_HYST'
    type: input
    function: Mid-point of the VBAT_OK hysteresis divider
  '11':
    name: 'OK_PROG'
    type: input
    function: Mid-point of the VBAT_OK threshold divider
  '12':
    name: 'VOUT_SET'
    type: input
    function: Mid-point of the VOUT divider
  '13':
    name: 'VBAT_OK'
    type: output
    function: Battery-good output, VSTOR-referenced, ~20 kOhm internal series R
  '14':
    name: 'VOUT'
    type: power_out
    function: Buck output; >= 22 uF to pin 15
  '15':
    name: 'VSS'
    type: power_in
    function: Buck power ground and signal ground for the dividers and VREF_SAMP capacitor
  '16':
    name: 'LBUCK'
    type: passive
    function: Buck switch node (inductor to VOUT)
  '17':
    name: 'NC'
    type: passive
    function: Connect to ground using the PowerPAD
  '18':
    name: 'VBAT'
    type: passive
    function: Storage element connection (I/O)
  '19':
    name: 'VSTOR'
    type: power_out
    function: Boost charger output; >= 4.7 uF || 0.1 uF to pin 1
  '20':
    name: 'LBOOST'
    type: passive
    function: Boost switch node (22 uH to VIN_DC)
  '21':
    name: 'PowerPAD'
    type: passive
    function: Thermal pad (datasheet figure 'Thermal Pad'); connect to GND
