<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 150" width="620" height="150">
  <defs>
    <linearGradient id="cg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#E09B2D" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#E09B2D" stop-opacity="0.45"/>
      <stop offset="1"    stop-color="#2F6BE4" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="pv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22355A"/><stop offset="1" stop-color="#16243E"/>
    </linearGradient>
  </defs>

  <!-- baseline -->
  <line x1="0" y1="86" x2="620" y2="86" stroke="url(#cg)" stroke-width="0.8" opacity="0.5"/>

  <!-- 1 sun -->
  <g stroke="#E09B2D" fill="none" stroke-width="1.3" stroke-linecap="round">
    <circle cx="40" cy="60" r="13"/>
    <g opacity="0.85">
      <line x1="40" y1="36" x2="40" y2="43"/><line x1="40" y1="77" x2="40" y2="84"/>
      <line x1="16" y1="60" x2="23" y2="60"/><line x1="57" y1="60" x2="64" y2="60"/>
      <line x1="23" y1="43" x2="28" y2="48"/><line x1="52" y1="72" x2="57" y2="77"/>
      <line x1="57" y1="43" x2="52" y2="48"/><line x1="28" y1="72" x2="23" y2="77"/>
    </g>
  </g>
  <text x="40" y="106" fill="#6F809C" font-family="Inter" font-size="7.5" text-anchor="middle" letter-spacing="1.4">SOLAR</text>

  <!-- 2 panel -->
  <g transform="translate(108,34)">
    <rect x="0" y="0" width="86" height="52" rx="2.5" fill="url(#pv)"/>
    <rect x="0" y="0" width="86" height="52" rx="2.5" fill="none"/>
    <rect x="0" y="0" width="86" height="52" rx="2.5" fill="none" stroke="#3E5679" stroke-width="1"/>
    <g stroke="#3E5679" stroke-width="0.6" opacity="0.9">
      <line x1="21.5" y1="0" x2="21.5" y2="52"/><line x1="43" y1="0" x2="43" y2="52"/>
      <line x1="64.5" y1="0" x2="64.5" y2="52"/>
      <line x1="0" y1="17.3" x2="86" y2="17.3"/><line x1="0" y1="34.6" x2="86" y2="34.6"/>
    </g>
  </g>
  <text x="151" y="106" fill="#6F809C" font-family="Inter" font-size="7.5" text-anchor="middle" letter-spacing="1.4">30 W / 18 V</text>

  <!-- arrow -->
  <g stroke="#E09B2D" stroke-width="1.1" fill="#E09B2D" opacity="0.9">
    <line x1="62" y1="60" x2="100" y2="60"/><polygon points="106,60 99,56.6 99,63.4"/>
  </g>

  <!-- 3 MPPT -->
  <g transform="translate(222,42)">
    <rect x="0" y="0" width="62" height="36" rx="4" fill="#17223A" stroke="#3E5679" stroke-width="1"/>
    <rect x="13" y="10" width="36" height="16" rx="2" fill="none" stroke="#E09B2D" stroke-width="1.1"/>
    <g stroke="#E09B2D" stroke-width="0.9" opacity="0.75">
      <line x1="13" y1="14" x2="7" y2="14"/><line x1="13" y1="22" x2="7" y2="22"/>
      <line x1="49" y1="14" x2="55" y2="14"/><line x1="49" y1="22" x2="55" y2="22"/>
    </g>
  </g>
  <text x="253" y="106" fill="#6F809C" font-family="Inter" font-size="7.5" text-anchor="middle" letter-spacing="1.4">MPPT</text>
  <g stroke="#E09B2D" stroke-width="1.1" fill="#E09B2D" opacity="0.9">
    <line x1="200" y1="60" x2="214" y2="60"/><polygon points="220,60 213,56.6 213,63.4"/>
    <line x1="290" y1="60" x2="304" y2="60"/><polygon points="310,60 303,56.6 303,63.4"/>
  </g>

  <!-- 4 battery x2 -->
  <g transform="translate(318,40)">
    <rect x="0" y="0" width="30" height="40" rx="3" fill="#17223A" stroke="#3E5679" stroke-width="1"/>
    <rect x="11" y="-3.5" width="8" height="3.5" rx="1" fill="#3E5679"/>
    <rect x="4" y="20" width="22" height="16" rx="1.5" fill="#E09B2D" opacity="0.9"/>
    <rect x="4" y="11" width="22" height="7" rx="1.5" fill="#E09B2D" opacity="0.35"/>
    <rect x="38" y="0" width="30" height="40" rx="3" fill="#17223A" stroke="#3E5679" stroke-width="1"/>
    <rect x="49" y="-3.5" width="8" height="3.5" rx="1" fill="#3E5679"/>
    <rect x="42" y="14" width="22" height="22" rx="1.5" fill="#2F6BE4" opacity="0.8"/>
  </g>
  <text x="352" y="106" fill="#6F809C" font-family="Inter" font-size="7.5" text-anchor="middle" letter-spacing="1.4">A / B</text>
  <g stroke="#2F6BE4" stroke-width="1.1" fill="#2F6BE4" opacity="0.9">
    <line x1="392" y1="60" x2="412" y2="60"/><polygon points="418,60 411,56.6 411,63.4"/>
  </g>

  <!-- 5 wearable node -->
  <g transform="translate(428,40)">
    <rect x="0" y="0" width="44" height="40" rx="5" fill="#17223A" stroke="#2F6BE4" stroke-width="1.1"/>
    <path d="M10,22 L15,22 L18,14 L23,30 L27,20 L31,22 L36,22" fill="none"
          stroke="#2F6BE4" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <text x="450" y="106" fill="#6F809C" font-family="Inter" font-size="7.5" text-anchor="middle" letter-spacing="1.4">ECG NODE</text>

  <!-- 6 ecg trace -->
  <path d="M480,60 L498,60 L503,60 L508,44 L514,76 L520,52 L525,60 L546,60 L556,60 L561,50 L566,66 L571,60 L620,60"
        fill="none" stroke="#E09B2D" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="620" cy="60" r="2.4" fill="#E09B2D"/>
</svg>
